<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050912">
<title>متابعة حالة الصيانة | ACT Manager</title>
<style>
:root{color-scheme:dark;--bg:#050912;--panel:#0b1728;--line:#183957;--blue:#20baff;--muted:#9db1c8;--text:#f2f7ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#0b2a49 0,transparent 42%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:22px}
main{width:min(100%,520px);background:linear-gradient(145deg,#10233a,#081321);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 20px 70px #0008}
.brand{text-align:center;color:var(--blue);font-weight:800;letter-spacing:2px;font-size:14px}.sub{text-align:center;color:var(--muted);margin:8px 0 24px}h1{font-size:23px;text-align:center;margin:0 0 20px}.status{border:1px solid var(--line);background:#06101d;border-radius:16px;padding:20px;text-align:center;margin-bottom:20px}.status small{display:block;color:var(--muted);margin-bottom:10px}.status strong{font-size:24px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--blue);margin-left:8px}.details{display:grid;gap:12px}.item{padding:13px 14px;border:1px solid #19334d;border-radius:12px;background:#071321}.item span{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.item b{font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:20px;line-height:1.8}.error{text-align:center;color:#ffb8b8;line-height:1.9}.loading{text-align:center;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="brand">ACT MANAGER</div>
  <div class="sub">CUSTOMER REPAIR TRACKING</div>
  <h1>متابعة حالة جهازك</h1>
  <div id="content" class="loading">جارٍ تحميل حالة الجهاز…</div>
  <div class="foot">هذه الصفحة مخصصة لمتابعة الجهاز المرتبط برمز QR الخاص بك.</div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCbailKYigVmcbqZHhi3kbvR2FvT1Q2JDw",authDomain:"act-phone-manager.firebaseapp.com",projectId:"act-phone-manager",storageBucket:"act-phone-manager.firebasestorage.app",messagingSenderId:"277621100210",appId:"1:277621100210:web:0676faca9d539631a243ab",measurementId:"G-R8MVR935PL"};
const db=getFirestore(initializeApp(firebaseConfig));
const content=document.getElementById('content');
const token=new URLSearchParams(location.search).get('id');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={'maintenance-pending':'قيد الإصلاح','maintenance-ready':'جاهز للاستلام','maintenance-failed':'لم يتم الإصلاح','maintenance-delivered':'تم التسليم'};
const colors={'maintenance-pending':'#ffcc55','maintenance-ready':'#48d597','maintenance-failed':'#ff6868','maintenance-delivered':'#54b8ff'};
function load(){
 if(!token){content.innerHTML='<p class="error">رابط المتابعة غير مكتمل. امسح رمز QR الموجود على إيصال جهازك.</p>';return;}
 onSnapshot(doc(db,'publicRepairTracking',token), snap=>{
  if(!snap.exists()||snap.data().active!==true){content.innerHTML='<p class="error">لم نعثر على بيانات متابعة لهذا الرمز. تأكد من مسح QR الصحيح أو تواصل مع المحل.</p>';return;}
  const d=snap.data();const label=labels[d.status]||d.statusLabel||'قيد الإصلاح';const color=colors[d.status]||'#20baff';
  content.innerHTML=`<section class="status"><small>الحالة الحالية</small><strong style="color:${color}"><i class="dot" style="background:${color}"></i>${esc(label)}</strong></section><section class="details"><div class="item"><span>الجهاز</span><b>${esc(d.deviceName||'غير محدد')}</b></div>${d.customerName?`<div class="item"><span>اسم العميل</span><b>${esc(d.customerName)}</b></div>`:''}${d.problem?`<div class="item"><span>العطل المسجل</span><b>${esc(d.problem)}</b></div>`:''}${d.receivedAt?`<div class="item"><span>تاريخ الاستلام</span><b>${esc(d.receivedAt)}</b></div>`:''}</section><p class="foot">الحالة تتحدث تلقائيًا عند تعديلها في المحل.<br>آخر تحديث: ${esc(new Date(d.updatedAt||Date.now()).toLocaleString('ar-EG'))}</p>`;
 }, e=>{console.error(e);content.innerHTML='<p class="error">تعذر تحميل الحالة. قد يحتاج المحل إلى تفعيل صلاحية قراءة صفحة المتابعة في قاعدة البيانات.</p>';});
}
load();
</script>
</body>
</html>
